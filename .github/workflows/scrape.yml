name: Scrape UZ train delays

on:
  schedule:
    # Every 30 minutes from 19:00 to 08:30 UTC.
    # Kyiv is UTC+3 in summer and UTC+2 in winter, so this window covers
    # 22:00-11:30 Kyiv (summer) and 21:00-10:30 Kyiv (winter) - i.e. from before
    # the first watched departure (22:28) to after the last watched arrival (09:33).
    # Actual start may drift by 5-20 minutes; that is fine for our purpose.
    - cron: "0,30 19-23,0-8 * * *"
  workflow_dispatch:          # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write             # needed so the job can commit data/delays.csv back to the repo

concurrency:
  group: scrape
  cancel-in-progress: false   # if a run is late and the next one starts, queue instead of overlapping

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_delays.py

      - name: Upload fetched page for debugging (only when the scraper failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-page
          path: debug/last_page.html
          if-no-files-found: ignore

      - name: Commit and push new data
        run: |
          git config user.name "delay-scraper-bot"
          git config user.email "delay-scraper-bot@users.noreply.github.com"
          git add data/delays.csv
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
